[package]
name = "noaa-gfs-ingest"
version = "5.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
aws-config = { version = "1.8", default-features = false, features = ["behavior-version-latest", "credentials-process", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1.103", default-features = false, features = ["rt-tokio", "rustls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
csv = "1.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.21"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
walkdir = "2.5"

[[bin]]
name = "noaa-gfs-ingest"
path = "src/main.rs"

[[bin]]
name = "generate-catalog"
path = "src/bin/generate_catalog.rs"
